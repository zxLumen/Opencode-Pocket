<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作品评分 · 后台</title>
<style>
  :root{
    --bg:#0b0f14; --card:#141b24; --card2:#1b2430; --line:#263140;
    --fg:#e6edf3; --dim:#8b98a5; --accent:#3b82f6;
    --ok:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font:15px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 48px;display:flex;flex-direction:column;gap:16px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:20px;font-weight:700;letter-spacing:.2px}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 11px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .dot.on{background:var(--ok)}
  .spacer{flex:1 1 auto}
  a.link{color:var(--dim);text-decoration:none;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
  a.link:hover{color:var(--fg);border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card>h2{font-size:13px;font-weight:600;color:var(--dim);padding:13px 16px 9px}
  #rework{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(180deg,#17233a,#141b24);border:1px solid #1d4ed8;border-radius:12px;padding:12px 14px}
  #rework .k{font-size:12px;color:#93c5fd;font-weight:600;white-space:nowrap;padding-top:1px}
  #rework .v{min-width:0;font-size:14px;overflow-wrap:anywhere}
  #rework .meta{color:var(--dim);font-size:12px;margin-top:3px;font-variant-numeric:tabular-nums}
  #rework.idle{background:var(--card);border-color:var(--line)}
  #rework.idle .k{color:var(--dim)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:10px 14px;border-top:1px solid var(--line);vertical-align:top}
  thead th{border-top:0;font-size:12px;font-weight:600;color:var(--dim);position:sticky;top:0;background:var(--card);z-index:1}
  tbody tr:hover{background:var(--card2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .page{font-weight:600;white-space:nowrap}
  .verdict{color:var(--fg)}
  .issues{color:var(--dim);font-size:13px}
  .issues ul{margin:0;padding-left:16px}
  .score{display:inline-flex;align-items:baseline;gap:2px;font-weight:700;font-variant-numeric:tabular-nums}
  .score .s{font-size:18px}
  .score .m{font-size:11px;color:var(--dim);font-weight:500}
  .bar{height:5px;width:64px;border-radius:3px;background:#0e141c;margin-top:5px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:3px}
  .s5 .s{color:var(--ok)} .s5 .bar>i{background:var(--ok)}
  .s4 .s{color:#eab308} .s4 .bar>i{background:#eab308}
  .s3 .s{color:var(--warn)} .s3 .bar>i{background:var(--warn)}
  .s2 .s,.s1 .s{color:var(--bad)} .s2 .bar>i,.s1 .bar>i{background:var(--bad)}
  .tag{display:inline-block;font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
  .tag.done{color:var(--ok);border-color:#14532d}
  .empty{color:var(--dim);padding:26px 16px;text-align:center;font-size:14px}
  #admin{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  #admin input{background:#0e141c;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
  #admin input#token{min-width:220px}
  #admin input#pg{min-width:190px}
  #admin button{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--fg);cursor:pointer}
  #admin button:hover{border-color:var(--accent)}
  #admin .note{color:var(--dim);font-size:12px}
  footer{color:var(--dim);font-size:12.5px}
  @media (max-width:720px){ th.hide,td.hide{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>作品评分</h1>
    <span class="pill"><span class="dot" id="p-session"></span><span id="t-session">会话</span></span>
    <span class="pill" id="p-round">第 1 轮</span>
    <span class="spacer"></span>
    <a class="link" href="/board">← 返回榜单</a>
  </header>

  <div id="rework" class="idle">
    <span class="k">返工队列</span>
    <span class="v"><span id="rw-text">当前无返工</span><div class="meta" id="rw-meta"></div></span>
  </div>

  <section class="card">
    <h2>评分明细 · 每轮产出后由大模型评审（5 分制，按分数升序，最差在最上）</h2>
    <table>
      <thead><tr>
        <th style="width:210px">页面</th>
        <th class="num" style="width:90px">评分</th>
        <th style="width:200px">评语</th>
        <th>待改进</th>
        <th class="num hide" style="width:76px">返工</th>
        <th class="num hide" style="width:96px">时间</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="6"><div class="empty">还没有评审记录（每轮跑完自动评）</div></td></tr></tbody>
    </table>
  </section>

  <div id="admin">
    <input id="token" type="password" placeholder="管理令牌">
    <input id="pg" type="text" placeholder="页面名，如 ai-models.html">
    <button id="do-review">立即评审</button>
    <button id="do-refresh">刷新</button>
    <span class="note" id="note">令牌只存本机</span>
  </div>

  <footer>评审记录持久化在 live.json；本页实时刷新（SSE）。低分页会按「待改进」自动返工，直到 5 分或达到返工上限。</footer>
</div>
<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  function hhmm(ts) { if (!ts) return "—"; var d = new Date(ts); function p(n) { return (n < 10 ? "0" : "") + n; } return p(d.getHours()) + ":" + p(d.getMinutes()); }
  var last = null;

  function render(s) {
    last = s;
    $("p-round").textContent = "第 " + (s.round || 1) + " 轮";
    var run = (s.session === "running");
    $("p-session").className = "dot" + (run ? " on" : "");
    $("t-session").textContent = run ? "运行中" : (s.session === "idle" ? "空闲" : (s.session === "unknown" ? "未知" : (s.session || "未知")));

    var rw = s.rework, box = $("rework");
    if (rw) {
      box.className = "";
      $("rw-text").textContent = rw.text || "";
      var rec = (s.reviews || []).filter(function (r) { return r.page === rw.page; })[0];
      var tries = rec ? (rec.tries || 0) : 0, max = s.reworkMax || 3;
      $("rw-meta").textContent = "页面 " + (rw.page || "—") + " · 已返工 " + tries + "/" + max + " 次 · 本轮已进行 " + (rw.rounds || 0) + " 轮 · " + hhmm(rw.at);
    } else {
      box.className = "idle";
      $("rw-text").textContent = "当前无返工";
      $("rw-meta").textContent = "";
    }

    var rows = s.reviews || [], tb = $("rows");
    if (!rows.length) { tb.innerHTML = '<tr><td colspan="6"><div class="empty">还没有评审记录（每轮跑完自动评）</div></td></tr>'; return; }
    var h = "";
    rows.forEach(function (r) {
      var sc = Math.max(1, Math.min(5, r.score || 0)), pct = sc * 20, iss = r.issues || [];
      h += '<tr>'
        + '<td class="page">' + esc(r.page) + '</td>'
        + '<td class="num"><span class="score s' + sc + '"><span class="s">' + sc + '</span><span class="m">/5</span></span><div class="bar"><i style="width:' + pct + '%"></i></div></td>'
        + '<td class="verdict">' + esc(r.verdict || "—") + '</td>'
        + '<td class="issues">' + (iss.length ? '<ul>' + iss.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + '</ul>' : '<span style="color:var(--dim)">—</span>') + '</td>'
        + '<td class="num hide"><span class="tag' + (sc >= 5 ? " done" : "") + '">' + (r.tries || 0) + '/' + (s.reworkMax || 3) + '</span></td>'
        + '<td class="num hide">' + hhmm(r.at) + '</td>'
        + '</tr>';
    });
    tb.innerHTML = h;
  }

  function load() { fetch("/__lb/state", { cache: "no-store" }).then(function (r) { return r.json(); }).then(render).catch(function () {}); }
  load();
  var es = null;
  try { es = new EventSource("/__lb/events"); es.onmessage = function (e) { try { render(JSON.parse(e.data)); } catch (err) {} }; es.onerror = function () {}; } catch (err) {}
  setInterval(function () { if (!es || es.readyState !== 1) load(); }, 3000);

  var tokenEl = $("token");
  try { tokenEl.value = localStorage.getItem("zx_admin_token") || ""; } catch (e) {}
  $("do-refresh").addEventListener("click", load);
  $("do-review").addEventListener("click", function () {
    var pg = $("pg").value.trim();
    if (!pg) { $("pg").focus(); return; }
    try { localStorage.setItem("zx_admin_token", tokenEl.value); } catch (e) {}
    $("note").textContent = "评审中…";
    fetch("/__lb/admin", { method: "POST", headers: { "content-type": "application/json", "x-admin-token": tokenEl.value }, body: JSON.stringify({ action: "review", page: pg, force: true }) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { $("note").textContent = "完成：" + (d.review ? ("评分 " + d.review.score + "/5") : "无结果"); load(); })
      .catch(function (e) { $("note").textContent = "失败：" + e.message + "（检查令牌）"; });
  });
})();
</script>
</body>
</html>
