# ============================================================================
# 访客沙盒栈(独立于博客栈):公开的 opencode web —— code-sandbox.{$DOMAIN}
#
# 三个服务:
#   sandbox-caddy   承载全部「访客锁定」逻辑的边缘 Caddy(:80);博客栈的 Caddy 只做
#                   TLS + 转发到本服务(见 infra/vps/sandbox/Caddyfile)。
#   opencode-play   沙盒本体(opencode web :4096),隔离边界=容器(非 root / 只读根 /
#                   cap 全剥 / 资源限额;只挂 /workspace 与家目录)。
#   opencode-play-init  一次性:就绪后确保「唯一固定会话」存在(卷被清空也能自愈)。
#
# ⚠️ 与博客栈刻意保留的两处共享(搬不走):
#   - 网络 docker_play(external):沙盒要访问博客 AI 网关(app:3000/api/ai/v1);
#     博客 Caddy 要访问本栈的 sandbox-caddy。
#   - 卷 docker_playground-*(external):会话/工作区数据,跨栈复用,不会被 `down -v` 清掉。
#
# 部署:./deploy.sh(或 ./auto-deploy.sh,cron 轮询本仓库 main 的 SHA)。
# ============================================================================
name: sandbox

services:
  # 边缘 Caddy:code-sandbox 的访客锁定(重定向 + 写入白名单 + 自建外壳)都在它的
  # Caddyfile 里;不发布端口,凭 docker_play 网络给博客栈的 Caddy 用。
  sandbox-caddy:
    image: caddy:2
    restart: unless-stopped
    # 向上游 opencode 注入 Basic 凭据(v2.0.x 强制鉴权)。密码由 .env 注入,
    # 这里现算成 "Basic <base64>" 供 Caddyfile 的 {$SANDBOX_UPSTREAM_AUTH} 使用。
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export SANDBOX_UPSTREAM_AUTH="Basic $$(printf 'opencode:%s' "$$PLAYGROUND_SERVER_PASSWORD" | base64 | tr -d '\n')"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    environment:
      # 锁定用的唯一会话 id(Caddyfile 里的 {$PLAYGROUND_SESSION_ID:ses_guest} 读它)
      PLAYGROUND_SESSION_ID: ${PLAYGROUND_SESSION_ID:-ses_guest}
      PLAYGROUND_SERVER_PASSWORD: ${PLAYGROUND_SERVER_PASSWORD:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - sandbox-caddy-data:/data
      - sandbox-caddy-config:/config
    expose:
      - "80"
    networks:
      - play

  # 沙盒本体(镜像由本仓库 CI 构建:infra/vps/sandbox/Dockerfile →
  # ghcr.io/zxlumen/opencode-pocket-sandbox;服务名/别名仍叫 opencode-play,边缘 Caddy 指向它)。
  opencode-play:
    image: ghcr.io/zxlumen/opencode-pocket-sandbox:${OPENCODE_SANDBOX_TAG:-latest}
    restart: unless-stopped
    # 注意:这里**不要** env_file: .env —— 会把无关密钥注入这个匿名可玩的容器。
    # 只传它真正需要的网关令牌,由 compose 从本目录 .env 插值 ${PLAYGROUND_AI_TOKEN}。
    environment:
      # 博客 AI 网关令牌(博客 admin「AI 密钥」页签发:每日 token 上限 + 便宜模型)
      ZX_AI_APP_TOKEN: ${PLAYGROUND_AI_TOKEN:-}
      # opencode v2.0.x 绑 0.0.0.0 时强制 Basic 鉴权;这里固定密码,由边缘 Caddy
      # 与容器内辅助服务各自注入,访客侧不可见。
      OPENCODE_SERVER_PASSWORD: ${PLAYGROUND_SERVER_PASSWORD:-}
      PLAYGROUND_SESSION_ID: ${PLAYGROUND_SESSION_ID:-ses_guest}
      # UI 上保留的最近会话条数(辅助服务读取;默认 40)
      PLAYGROUND_HISTORY_LIMIT: ${PLAYGROUND_HISTORY_LIMIT:-40}
      # 直播投票 + 自动接棒(见 docs/vps-sandbox.md「观众投票 → 自动接棒」)
      PLAYGROUND_LIVE: ${PLAYGROUND_LIVE:-1}
      PLAYGROUND_AUTODIRECT: ${PLAYGROUND_AUTODIRECT:-1}
      PLAYGROUND_MIN_VOTES: ${PLAYGROUND_MIN_VOTES:-0}
      PLAYGROUND_COOLDOWN_SEC: ${PLAYGROUND_COOLDOWN_SEC:-0}
      # 弹幕侧审核:默认关闭(0);开启后规则+AI 只放行「给沙盒的明确指令」进投票
      PLAYGROUND_MODERATE: ${PLAYGROUND_MODERATE:-0}
      PLAYGROUND_MODERATE_MODE: ${PLAYGROUND_MODERATE_MODE:-both}
      PLAYGROUND_BLOCKLIST: ${PLAYGROUND_BLOCKLIST:-}
      # 阻塞处理:question=逐题投票(默认) / auto=网关代答 / pause=只暂停人工答
      PLAYGROUND_QUESTION_POLICY: ${PLAYGROUND_QUESTION_POLICY:-vote}
      PLAYGROUND_QUESTION_VOTE_SEC: ${PLAYGROUND_QUESTION_VOTE_SEC:-20}
      PLAYGROUND_PERMISSION_POLICY: ${PLAYGROUND_PERMISSION_POLICY:-reject}
      # 弹幕操控网站预览(滚动/点开/返回/刷新),并入意见票池,5s 用票首执行
      PLAYGROUND_SITE_CMD: ${PLAYGROUND_SITE_CMD:-1}
      PLAYGROUND_SITE_VOTE_SEC: ${PLAYGROUND_SITE_VOTE_SEC:-5}
      # 空票时智能引导(网关生成 2-3 条可发弹幕的示例)
      PLAYGROUND_GUIDE: ${PLAYGROUND_GUIDE:-1}
      PLAYGROUND_GUIDE_INTERVAL_MS: ${PLAYGROUND_GUIDE_INTERVAL_MS:-30000}
      PLAYGROUND_MAX_ROUNDS: ${PLAYGROUND_MAX_ROUNDS:-0}
      PLAYGROUND_MERGE: ${PLAYGROUND_MERGE:-1}
      PLAYGROUND_MERGE_INTERVAL_MS: ${PLAYGROUND_MERGE_INTERVAL_MS:-30000}
      PLAYGROUND_ADMIN_TOKEN: ${PLAYGROUND_ADMIN_TOKEN:-}
      # 访客后端自愈(容器重建/崩溃后自动拉起 8000 后端;约定命令文件 /workspace/.sandbox-backend)
      PLAYGROUND_BACKEND_AUTOSTART: ${PLAYGROUND_BACKEND_AUTOSTART:-1}
      # YouTube 直播聊天采集(官方 Data API v3;API key 读公开聊天)
      YT_API_KEY: ${YT_API_KEY:-}
      YT_VIDEO_ID: ${YT_VIDEO_ID:-}
      # 弹幕源:youtube | bilibili | off(留空 = 按已配置的凭据自动选)
      CHAT_SOURCE: ${CHAT_SOURCE:-}
      # B 站直播间号(短号或真实 room_id);匿名读公开弹幕,无需 OAuth
      BILI_ROOM_ID: ${BILI_ROOM_ID:-}
      # 可选:以「已登录观众」身份读弹幕(低人气房间匿名常收不到)。SESSDATA 敏感,建议小号、只读。
      BILI_SESSDATA: ${BILI_SESSDATA:-}
      BILI_UID: ${BILI_UID:-}
      BILI_BUVID3: ${BILI_BUVID3:-}
    init: true
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,size=64m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    volumes:
      # 访客共享工作区(可写)
      - playground-data:/workspace
      # 家目录(会话/状态/配置);配置内容每次启动由 entrypoint 覆盖回出厂值
      - playground-home:/home/opencode
    expose:
      - "4096"
    networks:
      - play

  # 一次性初始化容器:等沙盒就绪后,确保「唯一固定会话」存在(卷被清空/首启时自动补建)。
  # 访客侧由 sandbox-caddy 锁定:只能进这一条会话(见 Caddyfile)。
  # 注意脚本里的 $ 全部写成 $$,否则会被 compose 当成变量插值。
  opencode-play-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      - opencode-play
    environment:
      SESSION_ID: ${PLAYGROUND_SESSION_ID:-ses_guest}
      PASSWORD: ${PLAYGROUND_SERVER_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        base="http://opencode-play:4096"
        auth="opencode:$$PASSWORD"
        i=0
        until curl -fsS -u "$$auth" "$$base/global/health" >/dev/null 2>&1 || [ "$$i" -ge 60 ]; do
          i=$$((i+1)); sleep 2
        done
        if curl -fsS -u "$$auth" -o /dev/null "$$base/api/session/$$SESSION_ID"; then
          echo "[init] 会话 $$SESSION_ID 已存在"
          exit 0
        fi
        curl -fsS -u "$$auth" -X POST "$$base/api/session" \
          -H 'content-type: application/json' \
          -d "{\"id\":\"$$SESSION_ID\",\"location\":{\"directory\":\"/workspace\"}}" \
          && echo "[init] 已补建会话 $$SESSION_ID"
        curl -fsS -u "$$auth" -X PATCH "$$base/api/session/$$SESSION_ID" \
          -H 'content-type: application/json' -d '{"title":"访客沙盒"}' >/dev/null || true
    networks:
      - play

  # 无头推流(可选;默认**不启动**,用 `docker compose --profile stream up -d streamer` 开启):
  #   Xvfb → Chromium 全屏打开沙盒工作台 → ffmpeg 抓屏 → YouTube RTMP。
  # 镜像由本仓库 CI 构建(见 streamer/);需要服务器 .env 提供 YT_STREAM_KEY(推流密钥)。
  # 与其它服务一样只在 docker_play 内网,无对外端口;画面来源即 sandbox-caddy 的站点。
  streamer:
    image: ghcr.io/zxlumen/opencode-pocket-streamer:${STREAMER_TAG:-latest}
    profiles: ["stream"]
    restart: unless-stopped
    depends_on:
      - sandbox-caddy
    environment:
      # 推流画面(默认沙盒工作台;日后可换成直播版页面)
      STREAM_URL: ${STREAM_URL:-http://sandbox-caddy/}
      # YouTube 推流密钥(服务器 .env:YT_STREAM_KEY),保密
      STREAM_KEY: ${YT_STREAM_KEY:-}
      STREAM_RTMP: ${STREAM_RTMP:-rtmp://a.rtmp.youtube.com/live2}
      WIDTH: ${STREAM_WIDTH:-1280}
      HEIGHT: ${STREAM_HEIGHT:-720}
      FPS: ${STREAM_FPS:-15}
      BITRATE: ${STREAM_BITRATE:-2500k}
      PRESET: ${STREAM_PRESET:-veryfast}
      START_DELAY: ${STREAM_START_DELAY:-8}
    # 本机是 2 核,给编码限个额度,别挤垮同机的其它服务
    cpus: 1.0
    mem_limit: 1200m
    shm_size: 256m
    networks:
      - play

volumes:
  sandbox-caddy-data:
  sandbox-caddy-config:
  # 跨栈复用博客栈创建的卷(里面是访客会话与工作区,必须保留)
  playground-data:
    external: true
    name: docker_playground-data
  playground-home:
    external: true
    name: docker_playground-home

networks:
  # 博客栈创建的共享内网:app(AI 网关)+ caddy(反代)都在上面
  play:
    external: true
    name: docker_play
