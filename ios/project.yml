name: OpencodePocket
options:
  bundleIdPrefix: cn.zxlumen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: T8TG4WAR43

targets:
  OpencodePocket:
    type: application
    platform: iOS
    sources:
      - path: OpencodePocket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.zxlumen.opencodepocket
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: OpencodePocket/Info.plist
      properties:
        CFBundleDisplayName: Opencode-Pocket
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: 用于语音输入指令（语音转文字）。
        NSSpeechRecognitionUsageDescription: 用于把语音识别成文字后发送给 opencode。
        CFBundleURLTypes:
          - CFBundleURLName: cn.zxlumen.opencodepocket
            CFBundleURLSchemes:
              - opencodepocket

schemes:
  OpencodePocket:
    build:
      targets:
        OpencodePocket: all
    run:
      config: Debug
