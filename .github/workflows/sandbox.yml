name: sandbox

# 构建并推送访客沙盒镜像(ghcr.io/<owner>/opencode-pocket-sandbox:<sha> + :latest)。
#
# 包名必须由本仓库首次推送(与其他子应用仓库同一模式):GHCR 的容器包只默认授权
# 「首次发布它的那个仓库」的 Actions 写入;沿用博客仓库创建的老包名 opencode-play
# 会被拒(permission_denied)。故本仓库用自己的包名,凭 GITHUB_TOKEN 即可推。
# 只改了 infra/vps/sandbox/ 才触发,所以本仓库的 iOS/pocketd 改动不会重建沙盒镜像。
#
# 部署不在本 workflow 里做:服务器用 cron 轮询本仓库 main 的 SHA,
# 看到对应 sha 的镜像已就绪就自动 deploy(见 infra/vps/sandbox/auto-deploy.sh)。
# 原因:GitHub runner 连云安全组的 22 端口常被丢弃,CI 直接 SSH 会超时。
on:
  push:
    branches: [main]
    paths:
      - 'infra/vps/sandbox/**'
      - '.github/workflows/sandbox.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库公开 → 镜像默认公开 → 服务器可匿名 pull,无需在服务器存任何凭据。
      - name: Compute image name (lowercase)
        id: img
        run: |
          echo "sandbox=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/opencode-pocket-sandbox" >> "$GITHUB_OUTPUT"

      - name: Build & push sandbox image
        uses: docker/build-push-action@v6
        with:
          context: infra/vps/sandbox
          file: infra/vps/sandbox/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.img.outputs.sandbox }}:${{ github.sha }}
            ${{ steps.img.outputs.sandbox }}:latest

      # 无头推流镜像(Xvfb + Chromium + ffmpeg → YouTube RTMP)。仅当服务器用
      # `--profile stream` 启动 streamer 服务时才用到;默认部署不碰它。
      - name: Compute streamer image name (lowercase)
        id: simg
        run: |
          echo "streamer=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/opencode-pocket-streamer" >> "$GITHUB_OUTPUT"

      - name: Build & push streamer image
        uses: docker/build-push-action@v6
        with:
          context: infra/vps/sandbox/streamer
          file: infra/vps/sandbox/streamer/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.simg.outputs.streamer }}:${{ github.sha }}
            ${{ steps.simg.outputs.streamer }}:latest

      # sourcemap 方案 B:裁剪版 Web UI 的 .map 不进公开镜像,但按「该次构建」留档。
      # 复用上面构建阶段(GHA cache 命中 → 秒级),只把 Dockerfile 的 app-maps 阶段
      # 导出到 runner,再作为 artifact 上传。出事时用同一 sha 的 artifact 还原源码栈。
      - name: Export sourcemaps (plan B)
        run: |
          docker buildx build \
            --target app-maps \
            --output type=local,dest=./app-maps \
            --cache-from type=gha \
            --file infra/vps/sandbox/Dockerfile \
            infra/vps/sandbox

      - name: Upload sourcemaps artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-maps-${{ github.sha }}
          path: app-maps/
          if-no-files-found: warn
          retention-days: 90
